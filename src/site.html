<!-- Mijozga topshirishda faqat tanlangan dizayn shriftlarini qoldiring:
     yashil: Unbounded + Manrope · olov: Dela Gothic One + Golos Text · rishton: Prata + Golos Text -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Golos+Text:wght@400;600;700&family=Manrope:wght@400;600;800&family=Prata&family=Unbounded:wght@600;800&display=swap">
<style>
/* Layout: mobile-first, photo-led. Demo switcher → promo strip → top bar → hero (text, photo, actions) → facts → "most ordered" photo rail → combo banner → sticky category chips → menu photo cards → how-to-order steps → reviews → location → footer with photo credits. Cart bar fixed at bottom; product and order sheets slide up over an inert page.
   Three designs share one structure: yashil (fresh market), olov (street-food poster), rishton (cobalt ceramics, arch-shaped photos). */
:root{
  --bg:#F7F8F3; --surface:#FFFFFF; --surface2:#EEF2E8; --ink:#16241B; --muted:#5A6A5F; --line:#DCE3D6;
  --brand:#1F5A3E; --brand-ink:#FFFFFF; --accent:#F2B21B; --accent-ink:#1A1A12; --hot:#C8402A; --fill:#2F7D47;
  --combo:#1F5A3E; --combo-ink:#FFFFFF; --tag-ink:#FFFFFF; --focus:#16241B;
  --display:"Unbounded","Arial Black",system-ui,sans-serif; --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:20px; --r-sm:12px; --ph-r:16px; --hero-r:28px; --h1:clamp(40px,11vw,74px); --h1-track:-.035em; --bw:1.5px;
  --shadow:0 1px 2px rgba(22,36,27,.06),0 8px 24px -12px rgba(22,36,27,.18);
  color-scheme:light; font-synthesis:none;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1712; --surface:#17221B; --surface2:#1E2C23; --ink:#ECF2EC; --muted:#9FB0A4; --line:#2A3A2F;
  --brand:#4FA078; --brand-ink:#06110B; --accent:#F6C445; --accent-ink:#1A1A12; --hot:#EC6A52; --fill:#6CC07B;
  --combo:#1F5A3E; --combo-ink:#F1F6F1; --tag-ink:#0F1712; --focus:#ECF2EC;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1712; --surface:#17221B; --surface2:#1E2C23; --ink:#ECF2EC; --muted:#9FB0A4; --line:#2A3A2F;
  --brand:#4FA078; --brand-ink:#06110B; --accent:#F6C445; --accent-ink:#1A1A12; --hot:#EC6A52; --fill:#6CC07B;
  --combo:#1F5A3E; --combo-ink:#F1F6F1; --tag-ink:#0F1712; --focus:#ECF2EC;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.6); color-scheme:dark}

/* Olov — street-food poster: mustard paper, black ink, tomato red */
:root[data-design="olov"]{
  --bg:#F6CF3E; --surface:#FFF6D6; --surface2:#F1C21F; --ink:#141210; --muted:#4A3F25; --line:#141210;
  --brand:#141210; --brand-ink:#F6CF3E; --accent:#E2381F; --accent-ink:#FFF6D6; --hot:#C42A14; --fill:#2E7A3A;
  --combo:#141210; --combo-ink:#F6CF3E; --tag-ink:#FFF6D6; --focus:#141210;
  --display:"Dela Gothic One","Arial Black",system-ui,sans-serif; --body:"Golos Text",system-ui,-apple-system,sans-serif;
  --r:6px; --r-sm:4px; --ph-r:4px; --hero-r:6px; --h1:clamp(44px,13vw,88px); --h1-track:-.01em; --bw:2.5px;
  --shadow:5px 5px 0 #141210}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"])[data-design="olov"]{
  --bg:#17140D; --surface:#221D12; --surface2:#2C2615; --ink:#F7E7B0; --muted:#C2B07A; --line:#F6CF3E;
  --brand:#F6CF3E; --brand-ink:#17140D; --accent:#F0573D; --accent-ink:#17140D; --hot:#FF7158; --fill:#6CC07B;
  --combo:#F6CF3E; --combo-ink:#17140D; --tag-ink:#17140D; --focus:#F7E7B0;
  --shadow:5px 5px 0 #F6CF3E}}
:root[data-theme="dark"][data-design="olov"]{
  --bg:#17140D; --surface:#221D12; --surface2:#2C2615; --ink:#F7E7B0; --muted:#C2B07A; --line:#F6CF3E;
  --brand:#F6CF3E; --brand-ink:#17140D; --accent:#F0573D; --accent-ink:#17140D; --hot:#FF7158; --fill:#6CC07B;
  --combo:#F6CF3E; --combo-ink:#17140D; --tag-ink:#17140D; --focus:#F7E7B0;
  --shadow:5px 5px 0 #F6CF3E}

/* Rishton — cobalt glaze, white clay, turquoise; photos sit in arches like an iwan */
:root[data-design="rishton"]{
  --bg:#F3F6FB; --surface:#FFFFFF; --surface2:#E3EBF7; --ink:#0F1E3D; --muted:#4F5F7E; --line:#D2DCEC;
  --brand:#1B3F96; --brand-ink:#FFFFFF; --accent:#0F7F7A; --accent-ink:#FFFFFF; --hot:#C2473B; --fill:#0F7F7A;
  --combo:#1B3F96; --combo-ink:#FFFFFF; --tag-ink:#FFFFFF; --focus:#0F1E3D;
  --display:"Prata",Georgia,"Times New Roman",serif; --body:"Golos Text",system-ui,-apple-system,sans-serif;
  --r:22px; --r-sm:14px; --ph-r:50% 50% 14px 14px; --hero-r:50% 50% 28px 28px; --h1:clamp(44px,12vw,82px); --h1-track:0;
  --shadow:0 1px 2px rgba(15,30,61,.06),0 10px 30px -14px rgba(27,63,150,.35)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"])[data-design="rishton"]{
  --bg:#0B1226; --surface:#121C36; --surface2:#182647; --ink:#E7EDFA; --muted:#9CABCB; --line:#24345C;
  --brand:#7EA2F2; --brand-ink:#0B1226; --accent:#42C7C1; --accent-ink:#0B1226; --hot:#F07A6C; --fill:#42C7C1;
  --combo:#1E3F8F; --combo-ink:#FFFFFF; --tag-ink:#0B1226; --focus:#E7EDFA;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.7)}}
:root[data-theme="dark"][data-design="rishton"]{
  --bg:#0B1226; --surface:#121C36; --surface2:#182647; --ink:#E7EDFA; --muted:#9CABCB; --line:#24345C;
  --brand:#7EA2F2; --brand-ink:#0B1226; --accent:#42C7C1; --accent-ink:#0B1226; --hot:#F07A6C; --fill:#42C7C1;
  --combo:#1E3F8F; --combo-ink:#FFFFFF; --tag-ink:#0B1226; --focus:#E7EDFA;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px -14px rgba(0,0,0,.7)}

*{box-sizing:border-box}
[hidden]{display:none !important}
html{-webkit-text-size-adjust:100%;scroll-padding-top:72px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--body);
  padding-bottom:calc(96px + env(safe-area-inset-bottom,0px));transition:background-color .25s,color .25s}
.wrap{max-width:1040px;margin:0 auto;padding-inline:16px}
a{color:inherit}
button{font:inherit;color:inherit}
button:disabled{cursor:not-allowed;opacity:.5}
img{max-width:100%}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
svg{display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
h2{font:800 clamp(26px,6.4vw,38px)/1.05 var(--display);margin:0;text-wrap:balance;letter-spacing:var(--h1-track)}
.sec{margin-top:48px}
.sec-head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:10px 16px;margin-bottom:16px}
.sec-head > div{display:grid;gap:6px;min-width:0}

/* Demo strip — only for showing the owner */
.demo{background:var(--ink);color:var(--bg);font-size:13px}
.demo .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding-block:8px}
.demo b{font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:11px;opacity:.7}
.demo :focus-visible{outline-color:currentColor}
.demo-note{opacity:.7;font-size:12px}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{border:1px solid color-mix(in srgb,var(--bg) 35%,transparent);background:transparent;color:var(--bg);
  border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px}
.seg button[aria-pressed="true"]{background:var(--bg);color:var(--ink)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;border:1px solid color-mix(in srgb,var(--bg) 40%,transparent)}
.demo .spacer{flex:1}

/* Promo strip */
.promo{background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:14px;text-align:center}
.promo .wrap{padding-block:8px}

/* Top bar */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 12px;padding-block:16px 0}
@media (max-width:420px){.status{font-size:12px;padding:5px 10px;gap:6px}}
.logo{display:flex;align-items:center;gap:10px;font:800 15px var(--display);text-decoration:none}
.logo i{width:40px;height:40px;border-radius:var(--r-sm);background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-style:normal;font-size:14px}
.status{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;border-radius:999px;padding:6px 12px;white-space:nowrap;
  background:var(--surface);border:var(--bw) solid var(--line)}
.status i{width:8px;height:8px;border-radius:50%;background:var(--fill);box-shadow:0 0 0 4px color-mix(in srgb,var(--fill) 25%,transparent)}
.status.closed i{background:var(--hot);box-shadow:0 0 0 4px color-mix(in srgb,var(--hot) 25%,transparent)}

/* Hero */
.hero{display:grid;gap:18px;padding-block:22px 4px;grid-template-areas:"text" "photo" "act"}
.hero-text{grid-area:text;min-width:0}
.hero-act{grid-area:act;min-width:0}
.hero-photo{grid-area:photo;margin:0;position:relative;min-width:0}
h1{font:800 var(--h1)/.92 var(--display);letter-spacing:var(--h1-track);margin:10px 0 14px;text-wrap:balance}
h1 span{color:var(--hot)}
.lead{font-size:18px;color:var(--muted);margin:0;max-width:36ch;text-wrap:pretty}
.rating{display:inline-flex;flex-wrap:wrap;align-items:center;gap:6px 8px;font-size:14px;color:var(--muted);margin-top:16px;text-decoration:none}
.rating b{color:var(--ink);font-size:16px}
.stars{display:flex;gap:2px;color:var(--accent)}
.stars svg{width:16px;height:16px}
.hero-photo .frame{position:relative;aspect-ratio:5/4;max-width:100%;border-radius:var(--hero-r);overflow:hidden;background:var(--surface2);box-shadow:var(--shadow)}
.hero-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:var(--hero-focus,50% 50%)}
.sticker{position:absolute;right:8px;top:-14px;background:var(--accent);color:var(--accent-ink);font:800 11.5px/1.05 var(--display);letter-spacing:-.02em;
  text-align:center;width:100px;height:100px;border-radius:50%;display:grid;place-content:center;transform:rotate(12deg);padding:10px;z-index:1;box-shadow:var(--shadow)}
.sticker small{display:block;font:700 10.5px/1.2 var(--body);letter-spacing:0;margin-top:3px}
@media (min-width:760px){
  .hero{grid-template-columns:1.1fr 1fr;grid-template-areas:"text photo" "act photo";column-gap:40px;align-items:center;padding-top:36px}
  .hero-text{align-self:end}.hero-act{align-self:start}
  .hero-photo .frame{aspect-ratio:4/5}
  .sticker{right:-14px;top:-14px;width:108px;height:108px;font-size:12.5px}
}

.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions .route{grid-column:1 / -1;min-height:46px;font-size:15px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border-radius:var(--r-sm);padding:0 16px;
  font-weight:700;text-decoration:none;font-size:16px;border:0;cursor:pointer;text-align:center}
.btn svg{width:20px;height:20px;flex:none}
.btn.primary{background:var(--brand);color:var(--brand-ink)}
.btn.accent{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface);color:var(--ink);border:var(--bw) solid var(--line)}
.btn.small{min-height:44px;font-size:15px}
.btn.link{background:transparent;color:var(--muted);min-height:40px;font-size:14px;text-decoration:underline;text-underline-offset:3px}
.phone{margin:12px 0 0;font-size:14px;color:var(--muted)}
.phone b{color:var(--ink);font-variant-numeric:tabular-nums;user-select:all}

.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:28px}
.fact{background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r-sm);padding:12px 14px;min-width:0}
.fact small{display:block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.fact b{display:block;font:800 18px/1.2 var(--display);margin-top:4px;font-variant-numeric:tabular-nums}
@media (max-width:420px){
  .facts{grid-template-columns:1fr 1fr}
  .fact:last-child{grid-column:1 / -1;display:flex;justify-content:space-between;align-items:baseline;gap:12px}
  .fact:last-child b{margin-top:0}
  .fact{padding:10px 12px}.fact b{font-size:16px}.fact small{font-size:10px}
}

/* Photo frame shared by cards. The category drawing sits under the photo: it shows while the photo loads or if it is missing. */
.ph{display:block;position:relative;overflow:hidden;background:var(--surface2);border-radius:var(--ph-r);border:0;padding:0;cursor:pointer;aspect-ratio:1/1;max-width:100%}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .35s;z-index:1}
.ph svg{position:absolute;inset:18%;width:64%;height:64%;opacity:.5}
div.ph{cursor:default}

/* Most-ordered rail */
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:min(70%,250px);gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;
  padding:4px max(16px,calc((100% - 1008px)/2)) 14px;scroll-padding-inline:max(16px,calc((100% - 1008px)/2));scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
@media (min-width:1040px){.rail{grid-auto-columns:calc((1008px - 42px)/4)}}
.rail{padding-bottom:30px;margin-bottom:-16px}
.hit{scroll-snap-align:start;background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;min-width:0;box-shadow:var(--shadow)}
.hit .ph{border-radius:0}
.hit .ph:focus-visible{outline-offset:-4px}
.hit .body{padding:12px 14px 14px;display:grid;gap:8px;flex:1}
.hit h3{margin:0;font-size:16px;line-height:1.3}
.hit .row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto}
.price{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.tag{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
  border-radius:999px;padding:2px 8px;background:var(--hot);color:var(--tag-ink);white-space:nowrap}
.tag.new{background:var(--fill)}
.tag.off{background:var(--muted);color:var(--surface)}
.ph .tag{position:absolute;left:10px;top:10px;z-index:2}

/* Combo banner */
.combo{display:grid;grid-template-columns:1fr;gap:16px;background:var(--combo);color:var(--combo-ink);border-radius:var(--r);padding:20px;position:relative;overflow:hidden}
.combo .stack{display:flex;padding-left:18px}
.combo .stack .ph{width:84px;height:84px;border-radius:50%;margin-left:-18px;border:4px solid var(--combo);flex:none}
.combo h3{font:800 24px/1.1 var(--display);margin:4px 0 6px}
.combo p{margin:0;opacity:.85;font-size:15px}
.combo .eyebrow{color:inherit;opacity:.75}
.combo .buy{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.combo .now{font:800 26px var(--display);font-variant-numeric:tabular-nums}
.combo s{opacity:.7;font-variant-numeric:tabular-nums}
.combo .save{background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:13px;border-radius:999px;padding:3px 10px}
.combo .buy .qty{margin-left:auto}
.combo .qty button{width:48px;height:48px;font-size:24px}
.combo .qty .plus{background:var(--combo-ink);color:var(--combo);box-shadow:0 6px 16px -6px rgba(0,0,0,.45)}
.combo .qty.has{background:var(--combo-ink);border-color:var(--combo-ink);color:var(--combo)}
.combo :focus-visible{outline-color:var(--combo-ink)}
@media (min-width:700px){
  .combo{grid-template-columns:auto 1fr;align-items:center;padding:28px 36px;gap:12px 32px}
  .combo .stack{grid-row:1 / span 2;align-self:center}
  .combo .stack .ph{width:104px;height:104px}
}

/* Category chips */
nav.cats{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:var(--bw) solid var(--line);margin-top:40px}
.cats .wrap{display:flex;gap:8px;overflow-x:auto;padding-block:12px;scrollbar-width:none}
.cats .wrap::-webkit-scrollbar{display:none}
.cats button{flex:none;font-weight:700;font-size:14px;padding:8px 16px;border-radius:999px;cursor:pointer;
  background:var(--surface);border:var(--bw) solid var(--line)}
.cats button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* Menu */
.menu-sec{padding-top:28px}
.menu-sec .sec-head{margin-bottom:14px}
.note{font-size:14px;color:var(--muted);margin:0}
.grid{display:grid;gap:12px;grid-template-columns:1fr}
@media (min-width:700px){.grid{grid-template-columns:1fr 1fr}}
.card{display:grid;grid-template-columns:112px 1fr;gap:14px;padding:10px;background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r);min-width:0}
.card .ph{width:112px}
.card .txt{display:flex;flex-direction:column;gap:4px;min-width:0;padding-block:2px}
.card h3{margin:0;font-size:16.5px;line-height:1.3;display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 6px}
.card h3 button{all:unset;cursor:pointer}
.card h3 button:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:4px}
.card p{margin:0;color:var(--muted);font-size:14px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:6px}
.weight{color:var(--muted);font-weight:600;font-size:13px;white-space:nowrap}
.card.off .ph img{filter:grayscale(1);opacity:.6}
.card.off .ph:has(img) svg{display:none}
.card.off .ph{background:var(--surface)}
.card.off h3,.card.off .price{color:var(--muted)}

.qty{display:flex;align-items:center;gap:2px;background:var(--surface);border:var(--bw) solid var(--line);border-radius:999px;padding:3px;flex:none}
.qty button{width:34px;height:34px;border-radius:50%;border:0;background:transparent;cursor:pointer;font-size:20px;font-weight:700;line-height:1;display:grid;place-items:center}
.qty .plus{background:var(--brand);color:var(--brand-ink)}
.qty span{min-width:20px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums}
.qty:not(.has) .minus,.qty:not(.has) span{display:none}
.qty:not(.has){border-color:transparent;background:transparent}

/* Steps */
.steps{list-style:none;margin:0;padding:0;display:grid;gap:12px;grid-template-columns:1fr;counter-reset:s}
@media (min-width:700px){.steps{grid-template-columns:repeat(3,1fr)}}

      <button type="submit" class="btn primary" id="send">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.9 4.3 18.8 19c-.2 1-.8 1.3-1.7.8l-4.6-3.4-2.2 2.1c-.2.2-.5.5-1 .5l.3-4.7 8.6-7.8c.4-.3-.1-.5-.6-.2L6.9 13l-4.6-1.4c-1-.3-1-1 .2-1.5L20.5 3c.8-.3 1.6.2 1.4 1.3z"/></svg>
        <span id="send-label"></span>
      </button>
      <button type="button" class="btn link" id="copy-btn" data-i18n="copy"></button>
    </div>
  </form>

      <a class="btn ghost" id="done-call"></a>
      <button type="button" class="btn link" id="new-order" data-i18n="newOrder"></button>
    </div>
  </div>

/* ================= Buyurtma matni ================= */
function orderNo() {
  if (!state.orderNo) state.orderNo = (Date.now() % 1679616).toString(36).toUpperCase();
  while (state.orderNo.length < 4) state.orderNo = "0" + state.orderNo;
  return state.orderNo;
}
function orderText() {
  var tt = cartTotals(), del = state.mode === "delivery", os = openState();
  var lines = ["🧾 №" + orderNo() + " · " + t("orderTitle") + " — " + CONFIG.name];
  if (!os.open) lines.unshift("⏰ " + t("preorder"));
  lines.push("");
  Object.keys(state.cart).forEach(function (id) { lines.push(state.cart[id] + " × " + L(ITEMS[id].name) + " — " + money(ITEMS[id].price * state.cart[id])); });
  lines.push("");
  if (del) lines.push(t("dfee") + (ZONES.length > 1 ? " (" + L(tt.zone.name) + ")" : "") + ": " + (tt.fee ? money(tt.fee) : t("free")));
  lines.push(t("total") + ": " + money(tt.total));

    if (state.pay === "cash" && ch) chTxt = " · " + t("changeMsg", { n: /^[\d\s.,]+$/.test(ch) && chN ? money(chN < 1000 ? chN * 1000 : chN) : ch });
    lines.push(t("payInfo") + ": " + t("pay_" + state.pay) + chTxt);
  }

  else lines.push(t("pickupMsg"));

}
function tgLink(txt) { return "https://t.me/" + CONFIG.telegram + "?text=" + encodeURIComponent(txt); }

var toastTimer;

var opener = null, openerSel = null;
function openSheet(id) {

  closeSheets(true);
  opener = from;
  openerSel = from && from.id ? "#" + from.id : from && from.dataset && from.dataset.open ? '[data-open="' + from.dataset.open + '"]:not([tabindex])' : null;
  if (id === "sheet") { $("order").hidden = false; $("done").hidden = true; renderSheet(); } else renderPd();
  $(id).hidden = false; $("scrim").hidden = false;
  $("page").inert = true; document.body.style.overflow = "hidden";

}
function closeSheets(keepFocus) {

  $("page").inert = false; document.body.style.overflow = "";
  if (keepFocus || !wasOpen) return;
  var ok = function (el) { return el && el !== document.body && document.contains(el) && el.getClientRects().length && getComputedStyle(el).visibility !== "hidden" && !el.closest('[aria-hidden="true"]') && !el.closest("[hidden]"); };
  var back = [opener, openerSel && document.querySelector(openerSel), $("open-cart"), document.querySelector(".bar .btn"), document.querySelector("#rail .plus, #menu .plus")].filter(ok)[0];
  if (back) back.focus({ preventScroll: true });
}

/* ================= Hodisalar ================= */
document.addEventListener("click", function (e) {
  var b = e.target.closest("button"); if (!b || b.disabled) return;
  if (b.closest("#designs")) { state.design = b.dataset.design; persist(); renderStatic(); return; }
  if (b.closest("#langs")) { state.lang = b.dataset.lang; persist(); renderAll(); return; }
  if (b.closest("#cats")) {
    state.cat = b.dataset.cat; renderCats();
    document.querySelectorAll("section.menu-sec").forEach(function (s) { s.hidden = state.cat !== "all" && s.dataset.cat !== state.cat; });
    var m = $("menu");
    if (state.cat !== "all" || m.getBoundingClientRect().top < 0)
      m.scrollIntoView({ block: "start", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
    $("cat-" + state.cat).focus({ preventScroll: true });
    return;
  }
  if (b.closest("#mode")) { state.mode = b.dataset.mode; renderSheet(); return; }
  if (b.closest("#pay")) { state.pay = b.dataset.pay; renderSheet(); $("pay").querySelector('[data-pay="' + state.pay + '"]').focus(); return; }
  if (b.hasAttribute("data-open")) { state.pd = b.getAttribute("data-open"); state.pdN = 1; openSheet("pd"); return; }
  if (b.hasAttribute("data-close")) { closeSheets(); return; }
  var q = b.closest(".qty");
  if (q) {
    var id = q.dataset.id, isPlus = b.classList.contains("plus"), n = Math.min(99, (state.cart[id] || 0) + (isPlus ? 1 : -1));
    var all = document.querySelectorAll('.qty[data-id="' + id + '"]'), idx = Array.prototype.indexOf.call(all, q), inSheet = !!q.closest("#lines");
    if (n > 0) state.cart[id] = n; else delete state.cart[id];
    state.orderNo = null;
    persist(); refreshQty(id);
    announce(t("inCart", { name: L(ITEMS[id].name), n: n > 0 ? n : 0 }));
    // fokus o'sha joyda qolsin, sahifa sakramasin
    var same = inSheet ? $("lines").querySelector('.qty[data-id="' + id + '"]') : document.querySelectorAll('.qty[data-id="' + id + '"]')[idx];
    var target = same && same.querySelector(n > 0 && !isPlus ? ".minus" : ".plus");
    if (target) target.focus({ preventScroll: true });
    else if (!$("sheet").hidden) { var nx = $("lines").querySelector(".qty .plus"); (nx || $("sheet").querySelector("[data-close]")).focus(); }
    return;
  }
  if (b.id === "pd-minus" || b.id === "pd-plus") { state.pdN = Math.min(99, Math.max(1, state.pdN + (b.id === "pd-plus" ? 1 : -1))); renderPd(); announce(String(state.pdN)); return; }
  if (b.id === "pd-add") {
    var pid = state.pd;
    state.cart[pid] = Math.min(99, (state.cart[pid] || 0) + state.pdN); state.orderNo = null; persist();
    closeSheets(); refreshQty(pid); toast(t("added")); return;
  }
  if (b.id === "open-cart") { openSheet("sheet"); return; }
  if (b.id === "new-order") {
    state.cart = {}; state.orderNo = null; persist();
    ["o-note", "o-change"].forEach(function (f) { $(f).value = ""; });
    closeSheets(true); renderAll(); var first = document.querySelector("#rail .plus, #menu .plus"); if (first) first.focus({ preventScroll: true }); return;
  }
  if (b.id === "copy-btn" || b.id === "done-copy") {
    var txt = orderText();
    var done = function () { toast(t("copied")); };
    try { navigator.clipboard.writeText(txt).then(done, function () { fallbackCopy(txt); done(); }); } catch (err) { fallbackCopy(txt); done(); }
  }
});
function fallbackCopy(txt) {
  var back = document.activeElement, host = document.querySelector(".sheet:not([hidden])") || document.body;
  var ta = document.createElement("textarea"); ta.value = txt; ta.setAttribute("readonly", ""); ta.style.cssText = "position:fixed;top:0;left:0;opacity:0";
  host.appendChild(ta); ta.select(); try { document.execCommand("copy"); } catch (e) {} ta.remove();
  if (back && back !== document.body) back.focus({ preventScroll: true });
}
$("scrim").addEventListener("click", function () { closeSheets(); });
document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !$("scrim").hidden) closeSheets(); });
$("o-phone").addEventListener("input", function () { $("phone-err").hidden = true; $("o-phone").removeAttribute("aria-invalid"); });
["o-addr", "o-mark"].forEach(function (f) { $(f).addEventListener("input", function () { $("addr-err").hidden = true; $("o-addr").removeAttribute("aria-invalid"); }); });
$("o-zone").addEventListener("change", function () { state.zone = $("o-zone").value; renderSheet(); });
$("order").addEventListener("submit", function (e) {
  e.preventDefault();
  if (cartTotals().short) return;
  var raw = $("o-phone").value.trim(), d = raw.replace(/\D/g, "");
  var phoneOk = /^998/.test(d) && (raw.charAt(0) === "+" || d.length > 9) ? d.length === 12  // +998 va 9 raqam
    : raw.charAt(0) === "+" ? d.length >= 10 && d.length <= 15                                 // boshqa davlat raqami
    : d.length === 9;                                                                          // 9 raqamli mahalliy
  if (!phoneOk) { $("phone-err").hidden = false; $("o-phone").setAttribute("aria-invalid", "true"); $("o-phone").focus(); return; }
  if (state.mode === "delivery" && !$("o-addr").value.trim() && !$("o-mark").value.trim()) {
    $("addr-err").hidden = false; $("o-addr").setAttribute("aria-invalid", "true"); $("o-addr").focus(); return;
  }

function sendOrder() {
  var tt = cartTotals(), btn = $("send");
  var body = { initData: IN_TG ? TG.initData : "", cart: state.cart, type: state.mode, zone: tt.zone.id, payment: state.pay || "cash",
    name: $("o-name").value.trim(), phone: $("o-phone").value.trim(), address: $("o-addr").value.trim(), landmark: $("o-mark").value.trim(),
    change: $("o-change").value.trim(), comment: $("o-note").value.trim(), lang: state.lang };
  if (state.geo && state.mode === "delivery") { body.lat = state.geo.lat; body.lon = state.geo.lon; }
  btn.disabled = true; $("send-label").textContent = t("sending");
  fetch(API_BASE + "/api/order", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (d && d.ok) return showOk(d);
      renderSheet(); $("min-err").hidden = false; $("min-err").textContent = (d && d.error) || t("netErr");
    })
    .catch(function () { renderSheet(); sendViaTelegram(); });
}

function showOk(d) {

  state.cart = {}; state.orderNo = null; persist();
  $("order").hidden = true; $("done").hidden = false; renderAll();
  $("done-h").textContent = t("okH", { no: d.id });
  $("done-p").textContent = IN_TG ? t("okTgP") : t("okP");

  $("done-call").href = "tel:" + CONFIG.phone; $("done-call").textContent = t("doneCall", { p: CONFIG.phoneText });
  try { TG && TG.HapticFeedback && TG.HapticFeedback.notificationOccurred("success"); } catch (e) {}
  if (IN_TG) { $("track").hidden = true; setTimeout(function () { try { TG.close(); } catch (e) {} }, 3500); }
  else track(d);
  $("done").querySelector("[data-close]").focus();
}

var trackTimer = null;
function track(d) {
  var el = $("track"); el.hidden = false; clearInterval(trackTimer);
  var poll = function () {
    fetch(API_BASE + "/api/status?id=" + d.id + "&token=" + d.token).then(function (r) { return r.json(); }).then(function (s) {
      if (!s || !s.ok) return;
      var flow = s.status === "canceled" ? ["new", "canceled"] : ["new", "accepted", s.type === "delivery" ? "onway" : "ready", "done"];
      var cur = flow.indexOf(s.status);
      el.innerHTML = flow.map(function (k, i) { return '<li class="' + (i <= cur ? "on" : "") + (i === cur ? " cur" : "") + '"><i></i>' + esc(t("st_" + k)) + "</li>"; }).join("");
      if (s.status === "done" || s.status === "canceled") clearInterval(trackTimer);
    }).catch(function () {});
  };
  el.innerHTML = '<li class="on cur"><i></i>' + esc(t("st_new")) + "</li>";
  poll(); trackTimer = setInterval(poll, 10000);
}

// Server ishlamasa: eski usul, buyurtma matni Telegram chatga
function sendViaTelegram() {
  var txt = orderText(), link = tgLink(txt);
  try { navigator.clipboard.writeText(txt).catch(function () { fallbackCopy(txt); }); } catch (err) { fallbackCopy(txt); }

/* Google Sheets CSV: qo'shtirnoq ichidagi vergul va "30,000.00" kabi formatlarni to'g'ri o'qiydi */
function parseCsv(t) {
  var rows = [], row = [], f = "", q = false;
  for (var i = 0; i < t.length; i++) {
    var c = t[i];
    if (q) { if (c === '"') { if (t[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ",") { row.push(f.trim()); f = ""; }
    else if (c === "\n" || c === "\r") { if (c === "\r" && t[i + 1] === "\n") i++; row.push(f.trim()); rows.push(row); row = []; f = ""; }
    else f += c;
  }
  if (f || row.length) { row.push(f.trim()); rows.push(row); }
  return rows;
}
function parsePrice(s) {
  s = String(s || "").replace(/[.,]\d{1,2}(?!\d)(?=\D*$)/, "");
  var p = parseInt(s.replace(/\D/g, ""), 10);
  return p >= 100 && p < 1e8 ? p : 0;
}
function loadPrices() {
  if (!CONFIG.pricesCsv || !window.fetch) return;
  var ctl = window.AbortController ? new AbortController() : null;
  var timer = setTimeout(function () { if (ctl) ctl.abort(); }, 3000);
  fetch(CONFIG.pricesCsv, ctl ? { signal: ctl.signal } : {}).then(function (r) { return r.ok ? r.text() : ""; }).then(function (csv) {
    clearTimeout(timer);
    var rows = parseCsv(csv);
    var head = (rows.shift() || []).map(function (h) { return h.toLowerCase(); });
    var iId = head.indexOf("id"), iPrice = head.indexOf("price"), iAv = head.indexOf("available");
    if (iId < 0) return;
    rows.forEach(function (r) {
      var it = ITEMS[r[iId]]; if (!it || it.combo) return;
      var p = parsePrice(r[iPrice]); if (p) it.price = p;
      if (iAv > -1 && r[iAv] !== "") it.available = !/^(0|no|false|yo'q|нет)$/i.test(r[iAv]);
    });
    if (CONFIG.combo) { CONFIG.combo.full = CONFIG.combo.items.reduce(function (s, id) { return s + ITEMS[id].price; }, 0); ITEMS[CONFIG.combo.id].available = CONFIG.combo.items.every(isOn); }
    Object.keys(state.cart).forEach(function (id) { if (!isOn(id)) delete state.cart[id]; });
    renderAll();
  }).catch(function () { clearTimeout(timer); });
}
